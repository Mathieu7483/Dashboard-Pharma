<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Dashboard | Client Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="navbar-placeholder"></div>

        <main class="content-area">
            <header class="top-bar">
                <div class="page-info">
                    <h2>Client Management System</h2>
                </div>
                <div class="top-bar-right">
                    <div class="avatar"></div>
                    <button id="logout-btn" class="btn-logout-top">Logout</button>
                </div>
            </header>

            <section class="content-section">
                <div class="clients-container">
                    <header class="clients-header">
                        <h1>👥 Patient Management</h1>
                        <button id="add-client-btn" class="btn-logout-top">➕ Add New Client</button>
                    </header>

                    <div class="search-bar widget">
                        <input type="text" id="clients-search" placeholder="Search by name, email, phone or address..." class="search-box input">
                    </div>

                    <div class="table-responsive widget">
                        <table id="clients-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Address</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="clients-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <footer class="main-footer">
                <p>&copy; 2026 Dashboard Pharma</p>
            </footer>
        </main>
    </div>

    <!-- Modal d'ajout / édition de client -->
    <div id="client-modal" class="modal">
        <div class="modal-content">
            <header class="widget-header">
                <h3 id="client-modal-title">Add New Client</h3>
            </header>
            <form id="client-form">
                <input type="hidden" id="client-id" name="id">

                <div class="form-group">
                    <label for="client-first-name">First Name *</label>
                    <input type="text" id="client-first-name" name="first_name" required class="input">
                </div>
                <div class="form-group">
                    <label for="client-last-name">Last Name *</label>
                    <input type="text" id="client-last-name" name="last_name" required class="input">
                </div>
                <div class="form-group">
                    <label for="client-phone">Phone Number</label>
                    <input type="tel" id="client-phone" name="phone" class="input">
                </div>
                <div class="form-group">
                    <label for="client-email">Email Address *</label>
                    <input type="email" id="client-email" name="email" required class="input">
                </div>
                <div class="form-group">
                    <label for="client-address">Address</label>
                    <input type="text" id="client-address" name="address" class="input">
                </div>
                <div class="form-actions">
                    <button type="button" id="close-client-modal" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-logout-top">Save Client</button>
                </div>
            </form>
        </div>
    </div>

    <script src="javascript/common.js"></script>
    <script src="javascript/clients.js"></script>
</body>
</html>
