<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Dashboard | Doctor Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="navbar-placeholder"></div>

        <main class="content-area">
            <header class="top-bar">
                <div class="page-info">
                    <h2>Doctor Management System</h2>
                </div>
                <div class="top-bar-right">
                    <div class="avatar"></div>
                    <button id="logout-btn" class="btn-logout-top">Logout</button>
                </div>
            </header>

            <section class="content-section">
                <div class="doctors-container">
                    <header class="doctors-header">
                        <h1>👨‍⚕️ Prescribing Doctors</h1>
                        <button id="add-doctor-btn" class="btn-logout-top">➕ Add New Doctor</button>
                    </header>

                    <div class="search-bar widget">
                        <input type="text" id="doctors-search" placeholder="Search by name, specialty, email or phone..." class="search-box input">
                    </div>

                    <div class="table-responsive widget">
                        <table id="doctors-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Specialty</th>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Address</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="doctors-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <footer class="main-footer">
                <p>&copy; 2026 Dashboard Pharma</p>
            </footer>
        </main>
    </div>

    <!-- Modal d'ajout / édition de médecin -->
    <div id="doctor-modal" class="modal">
        <div class="modal-content">
            <header class="widget-header">
                <h3 id="doctor-modal-title">Add New Doctor</h3>
            </header>
            <form id="doctor-form">
                <input type="hidden" id="doctor-id" name="id">

                <div class="form-group">
                    <label for="doctor-first-name">First Name *</label>
                    <input type="text" id="doctor-first-name" name="first_name" required class="input">
                </div>
                <div class="form-group">
                    <label for="doctor-last-name">Last Name *</label>
                    <input type="text" id="doctor-last-name" name="last_name" required class="input">
                </div>
                <div class="form-group">
                    <label for="doctor-specialty">Specialty *</label>
                    <input type="text" id="doctor-specialty" name="specialty" required class="input">
                </div>
                <div class="form-group">
                    <label for="doctor-phone">Phone Number</label>
                    <input type="tel" id="doctor-phone" name="phone" class="input">
                </div>
                <div class="form-group">
                    <label for="doctor-email">Email Address</label>
                    <input type="email" id="doctor-email" name="email" class="input">
                </div>
                <div class="form-group">
                    <label for="doctor-address">Address</label>
                    <input type="text" id="doctor-address" name="address" class="input">
                </div>
                <div class="form-actions">
                    <button type="button" id="close-doctor-modal" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-logout-top">Save Doctor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="javascript/common.js"></script>
    <script src="javascript/doctors.js"></script>
</body>
</html>
