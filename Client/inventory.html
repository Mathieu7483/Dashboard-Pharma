<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Dashboard | Inventory Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="navbar-placeholder"></div>

        <main class="content-area">
            <header class="top-bar">
                <div class="page-info">
                    <h2>Inventory Management System</h2>
                </div>
                <div class="top-bar-right">
                    <div class="avatar"></div>
                    <button id="logout-btn" class="btn-logout-top">Logout</button>
                </div>
            </header>

            <section class="content-section">
                <div class="inventory-container">
                    <header class="inventory-header">
                        <h1>📦 Product Stock & Inventory</h1>
                        <button id="add-product-btn" class="btn-logout-top">➕ Add New Product</button>
                    </header>

                    <div class="search-bar widget">
                        <input type="text" id="inventory-search" placeholder="Search by name, active ingredient or dosage..." class="search-box input">
                    </div>

                    <div class="table-responsive widget">
                        <table id="inventory-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Active Ingredient</th>
                                    <th>Dosage</th>
                                    <th>Price (€)</th>
                                    <th>Stock</th>
                                    <th>Rx only</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <footer class="main-footer">
                <p>&copy; 2026 Dashboard Pharma</p>
            </footer>
        </main>
    </div>

    <!-- Modal d'ajout / édition de produit -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <header class="widget-header">
                <h3 id="product-modal-title">Add New Product</h3>
            </header>
            <form id="product-form">
                <input type="hidden" id="product-id" name="id">

                <div class="form-group">
                    <label for="product-name">Product Name * <small>(min. 3 characters)</small></label>
                    <input type="text" id="product-name" name="name" required minlength="3" maxlength="100" class="input">
                </div>
                <div class="form-group">
                    <label for="product-ingredient">Active Ingredient *</label>
                    <input type="text" id="product-ingredient" name="active_ingredient" required class="input">
                </div>
                <div class="form-group">
                    <label for="product-dosage">Dosage</label>
                    <input type="text" id="product-dosage" name="dosage" placeholder="e.g. 500 mg, tablet" class="input">
                </div>
                <div class="form-group">
                    <label for="product-cip13">CIP13 code</label>
                    <input type="text" id="product-cip13" name="cip13" class="input">
                </div>
                <div class="form-group">
                    <label for="product-price">Price (€) *</label>
                    <input type="number" step="0.01" min="0.01" id="product-price" name="price" required class="input">
                </div>
                <div class="form-group">
                    <label for="product-stock">Stock Quantity *</label>
                    <input type="number" min="0" id="product-stock" name="stock" required class="input">
                </div>
                <div class="form-group form-check">
                    <label for="product-rx"><input type="checkbox" id="product-rx" name="is_prescription_only"> Prescription only</label>
                </div>
                <div class="form-actions">
                    <button type="button" id="close-product-modal" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-logout-top">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="javascript/common.js"></script>
    <script src="javascript/inventory.js"></script>
</body>
</html>
