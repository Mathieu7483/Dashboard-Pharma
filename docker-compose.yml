services:
  web:
    build: .
    container_name: dashboard_pharma_api
    restart: unless-stopped
    # Published on localhost only: put a reverse proxy with HTTPS (Caddy, nginx...) in front.
    ports:
      - "127.0.0.1:5000:5000"
    # Secrets live in a .env file that is NOT committed (see .env.example).
    # The build/run fails fast if it is missing.
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      # Persist the SQLite database outside the container
      - sqlite_data:/app/Server/database

volumes:
  sqlite_data:
